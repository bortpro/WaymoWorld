<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SF Laser Taxi Debug</title>
<style>
  :root {
    --bg: #0b0f1a; --panel: #121829; --border: #24304d; --text: #d8deea; --muted: #7d88a3;
    --accent: #00d0e0; --good: #2bd67b; --warn: #e0b000; --bad: #ff4d6d;
    --s1: #14a8b8; --s2: #9d6bea; --grid: #1a2238;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 1; }
  header h1 { font-size: 15px; margin: 0; color: var(--accent); letter-spacing: 1px; }
  #status { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  #status::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--dot, var(--muted)); }
  header .spacer { flex: 1; }
  button, select { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  main { padding: 16px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
  section { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; min-width: 0; }
  section.wide { grid-column: 1 / -1; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 0 0 10px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .card { border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; }
  .card .v { font-size: 18px; font-weight: bold; }
  .card .k { color: var(--muted); font-size: 11px; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: normal; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); padding: 6px 0; }
  .good { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  canvas { width: 100%; aspect-ratio: 1; background: #070a12; border-radius: 6px; display: block; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 16px; }
  .kv .k { color: var(--muted); }
  #events { max-height: 360px; overflow: auto; }
  pre { margin: 0; max-height: 500px; overflow: auto; font-size: 12px; }
  details summary { cursor: pointer; color: var(--muted); }
  .legend { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 8px; }
  .legend .key, .tip .key { display: inline-block; width: 14px; height: 2px; background: var(--c); vertical-align: middle; margin-right: 6px; }
  .legend b { margin-left: 6px; }
  .chart-wrap { position: relative; }
  canvas#dau { aspect-ratio: auto; height: 260px; background: none; touch-action: pan-y; }
  .tip { position: absolute; top: 0; pointer-events: none; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; white-space: nowrap; }
  .tip .muted, .muted { color: var(--muted); }
  .tip b { display: inline-block; min-width: 3ch; text-align: right; margin-right: 6px; }
</style>
</head>
<body>
<header>
  <h1>SF LASER TAXI SERVER DEBUG</h1>
  <span id="status">connecting…</span>
  <span class="spacer"></span>
  <label>poll <select id="interval">
    <option value="250">250 ms</option>
    <option value="500">500 ms</option>
    <option value="1000" selected>1 s</option>
    <option value="5000">5 s</option>
  </select></label>
  <button id="pause">Pause</button>
</header>
<main>
  <section class="wide"><h2>Overview</h2><div class="cards" id="cards"></div></section>
  <section class="wide">
    <h2>Daily users <span id="dau-tz"></span> <select id="dau-days">
      <option value="14">14 days</option>
      <option value="30" selected>30 days</option>
      <option value="90">90 days</option>
      <option value="365">365 days</option>
    </select></h2>
    <div class="legend">
      <span><span class="key" style="--c:var(--s1)"></span>DAU (joins)<b id="dau-today"></b></span>
      <span><span class="key" style="--c:var(--s2)"></span>uDAU (unique players)<b id="udau-today"></b></span>
    </div>
    <div class="chart-wrap"><canvas id="dau" role="img" aria-label="Daily joins and unique players"></canvas><div class="tip" id="dau-tip" hidden></div></div>
    <details><summary>Table</summary><div class="scroll" id="dau-table"></div></details>
  </section>
  <section><h2>Map (top-down, x → right, z ↓)</h2><canvas id="map" width="800" height="800"></canvas></section>
  <section><h2>Counters</h2><div id="counters"></div></section>
  <section class="wide"><h2>Players (joined)</h2><div class="scroll" id="players"></div></section>
  <section class="wide"><h2>Connections (all sockets)</h2><div class="scroll" id="connections"></div></section>
  <section><h2>Event log <select id="event-filter"><option value="">all</option></select></h2><div id="events"></div></section>
  <section><h2>Config</h2><div id="config"></div></section>
  <section class="wide"><details><summary>Raw state JSON</summary><pre id="raw"></pre></details></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let paused = false;
let timer = null;
let prev = null; // previous state, for per-second rates

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  Object.assign(node, props);
  node.append(...children);
  return node;
}

function ago(t, now) {
  if (!t) return '—';
  const s = (now - t) / 1000;
  if (s < 1) return `${Math.round(s * 1000)}ms`;
  if (s < 120) return `${s.toFixed(1)}s`;
  if (s < 7200) return `${Math.round(s / 60)}m`;
  return `${(s / 3600).toFixed(1)}h`;
}

function duration(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? `${h}h ${m}m` : m ? `${m}m ${s}s` : `${s}s`;
}

const mb = (b) => (b / 1048576).toFixed(1) + ' MB';
const fixed = (v, d = 1) => (typeof v === 'number' ? v.toFixed(d) : String(v));

function table(columns, rows) {
  if (rows.length === 0) return el('div', { className: 'empty', textContent: 'none' });
  const thead = el('thead', {}, el('tr', {}, ...columns.map(c => el('th', { textContent: c.label }))));
  const tbody = el('tbody', {}, ...rows.map(r => el('tr', {}, ...columns.map(c => {
    const v = c.get(r);
    const td = el('td', { textContent: v ?? '—' });
    if (c.num) td.className = 'num';
    if (c.cls) td.className += ' ' + (c.cls(r) || '');
    return td;
  }))));
  return el('table', {}, thead, tbody);
}

function kv(obj) {
  const wrap = el('div', { className: 'kv' });
  const entries = Object.entries(obj);
  if (entries.length === 0) wrap.append(el('span', { className: 'k', textContent: 'none' }), el('span'));
  for (const [k, v] of entries) {
    wrap.append(el('span', { className: 'k', textContent: k }), el('span', { textContent: typeof v === 'object' ? JSON.stringify(v) : String(v) }));
  }
  return wrap;
}

function rate(cur, key) {
  if (!prev) return '—';
  const dt = (cur.now - prev.now) / 1000;
  return dt > 0 ? ((cur.stats[key] - prev.stats[key]) / dt) : 0;
}

function renderCards(s) {
  const kbOut = prev ? ((s.stats.bytesOut - prev.stats.bytesOut) / 1024 / ((s.now - prev.now) / 1000)) : '—';
  const cards = [
    ['uptime', duration(s.server.uptimeS)],
    ['ws clients', s.server.wsClients],
    ['players joined', s.server.players],
    ['spectators', s.server.wsClients - s.server.players],
    ['msgs in / s', fixed(rate(s, 'msgsIn'))],
    ['msgs out / s', fixed(rate(s, 'msgsOut'))],
    ['KB out / s', fixed(kbOut)],
    ['heap used', mb(s.server.memory.heapUsed)],
    ['rss', mb(s.server.memory.rss)],
    ['total kills', s.stats.kills],
    ['next player id', s.server.nextId],
    ['node', s.server.node],
    ['database', s.persistence.connected ? 'connected' : s.persistence.enabled ? 'FAILED' : 'off'],
  ];
  $('cards').replaceChildren(...cards.map(([k, v]) => el('div', { className: 'card' }, el('div', { className: 'v', textContent: v }), el('div', { className: 'k', textContent: k }))));
}

function renderPlayers(s) {
  const now = s.now;
  $('players').replaceChildren(table([
    { label: 'id', get: p => p.id, num: true },
    { label: 'name', get: p => p.name },
    { label: 'bot', get: p => p.bot ? 'yes' : '' },
    { label: 'hp', get: p => p.hp, num: true, cls: p => p.hp > 50 ? 'good' : p.hp > 25 ? 'warn' : 'bad' },
    { label: 'kills', get: p => p.kills, num: true },
    { label: 'deaths', get: p => p.deaths, num: true },
    { label: 'x', get: p => fixed(p.x), num: true },
    { label: 'z', get: p => fixed(p.z), num: true },
    { label: 'angle', get: p => fixed(p.a, 2), num: true },
    { label: 'speed', get: p => fixed(p.s), num: true },
    { label: 'last state', get: p => ago(p.lastStateAt, now), cls: p => now - p.lastStateAt > 1000 ? 'warn' : '' },
    { label: 'protected', get: p => p.spawnProtected ? 'yes' : 'no', cls: p => p.spawnProtected ? 'warn' : '' },
    { label: 'live shots', get: p => p.liveShots, num: true },
    { label: 'last shot', get: p => ago(p.lastShotAt, now) },
    { label: 'spawned', get: p => ago(p.spawnedAt, now) },
    { label: 'joined', get: p => ago(p.joinedAt, now) },
  ], s.players));
}

const READY = ['CONNECTING', 'OPEN', 'CLOSING', 'CLOSED'];
function renderConnections(s) {
  const now = s.now;
  $('connections').replaceChildren(table([
    { label: 'player', get: c => c.playerId ?? 'spectator' },
    { label: 'ip', get: c => c.ip },
    { label: 'state', get: c => READY[c.readyState] ?? c.readyState },
    { label: 'alive', get: c => c.isAlive ? 'yes' : 'no', cls: c => c.isAlive ? '' : 'warn' },
    { label: 'connected', get: c => ago(c.connectedAt, now) },
    { label: 'msgs in', get: c => c.msgsIn, num: true },
    { label: 'bytes in', get: c => c.bytesIn, num: true },
    { label: 'last msg', get: c => ago(c.lastMsgAt, now) },
    { label: 'last type', get: c => c.lastMsgType },
    { label: 'send buffer', get: c => c.bufferedAmount, num: true, cls: c => c.bufferedAmount > 65536 ? 'bad' : '' },
    { label: 'user agent', get: c => c.userAgent.slice(0, 80) },
  ], s.connections));
}

function renderCounters(s) {
  const { msgsInByType, shotsRejected, hitsRejected, ...scalars } = s.stats;
  $('counters').replaceChildren(
    kv(scalars),
    el('h2', { textContent: 'msgs in by type', style: 'margin-top:12px' }), kv(msgsInByType),
    el('h2', { textContent: 'shots rejected', style: 'margin-top:12px' }), kv(shotsRejected),
    el('h2', { textContent: 'hits rejected', style: 'margin-top:12px' }), kv(hitsRejected),
    el('h2', { textContent: 'persistence', style: 'margin-top:12px' }), kv(s.persistence),
  );
}

function renderEvents(s) {
  const filter = $('event-filter');
  const kinds = new Set(s.events.map(e => e.kind));
  for (const k of kinds) {
    if (![...filter.options].some(o => o.value === k)) filter.append(el('option', { value: k, textContent: k }));
  }
  const shown = s.events.filter(e => !filter.value || e.kind === filter.value).slice().reverse();
  $('events').replaceChildren(table([
    { label: 'ago', get: e => ago(e.t, s.now) },
    { label: 'kind', get: e => e.kind, cls: e => e.kind === 'kill' ? 'bad' : e.kind === 'hit-rejected' ? 'warn' : '' },
    { label: 'data', get: e => { const { t, kind, ...rest } = e; return JSON.stringify(rest); } },
  ], shown));
}

function renderMap(s) {
  const canvas = $('map');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, L = s.config.WORLD_LIMIT;
  const toPx = (v) => (v + L) / (2 * L) * W;
  ctx.clearRect(0, 0, W, W);

  // Bay (x > 450) and city grid (100-unit cells, centred on the origin)
  ctx.fillStyle = 'rgba(0, 80, 140, 0.25)';
  ctx.fillRect(toPx(450), 0, W - toPx(450), W);
  ctx.strokeStyle = '#1a2238';
  ctx.lineWidth = 1;
  for (let v = -600; v <= 600; v += 100) {
    ctx.beginPath(); ctx.moveTo(toPx(v), toPx(-600)); ctx.lineTo(toPx(v), toPx(600)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(toPx(-600), toPx(v)); ctx.lineTo(toPx(600), toPx(v)); ctx.stroke();
  }
  ctx.strokeStyle = '#2c3a5e';
  ctx.strokeRect(toPx(-L), toPx(-L), toPx(L) - toPx(-L), toPx(L) - toPx(-L));

  for (const p of s.players) {
    const x = toPx(p.x), y = toPx(p.z);
    // hit range circle
    ctx.strokeStyle = 'rgba(0, 208, 224, 0.08)';
    ctx.beginPath(); ctx.arc(x, y, s.config.MAX_HIT_RANGE / (2 * L) * W, 0, Math.PI * 2); ctx.stroke();
    // heading: forward is (sin a, cos a) in (x, z)
    ctx.strokeStyle = '#00d0e0';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.sin(p.a) * 24, y + Math.cos(p.a) * 24); ctx.stroke();
    ctx.fillStyle = p.spawnProtected ? '#e0b000' : p.hp > 50 ? '#2bd67b' : p.hp > 25 ? '#e0b000' : '#ff4d6d';
    ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#d8deea';
    ctx.font = '22px ui-monospace, Menlo, monospace';
    ctx.fillText(`#${p.id} ${p.name} (${p.hp})`, x + 14, y - 10);
  }
}

function render(s) {
  renderCards(s);
  renderMap(s);
  renderCounters(s);
  renderPlayers(s);
  renderConnections(s);
  renderEvents(s);
  $('config').replaceChildren(kv(s.config));
  if ($('raw').closest('details').open) $('raw').textContent = JSON.stringify(s, null, 2);
  prev = s;
}

function setStatus(text, color) {
  $('status').textContent = text;
  $('status').style.setProperty('--dot', color);
}

async function poll() {
  clearTimeout(timer);
  if (paused) return;
  try {
    const res = await fetch('/debug/state' + location.search, { cache: 'no-store' });
    if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
    const s = await res.json();
    render(s);
    setStatus(`live · ${new Date(s.now).toLocaleTimeString()}`, 'var(--good)');
  } catch (err) {
    setStatus(`error: ${err.message}`, 'var(--bad)');
  }
  timer = setTimeout(poll, Number($('interval').value));
}

// --- Daily users chart ---
const DAU_SERIES = [
  { key: 'dau', label: 'DAU (joins)', color: '#14a8b8' },
  { key: 'udau', label: 'uDAU (unique players)', color: '#9d6bea' },
];
let dau = null;      // { tz, days: [{ day, dau, udau }] }
let dauHover = null; // index of the hovered day
let dauTimer = null;
const DAU_PAD = { l: 40, r: 16, t: 12, b: 24 };

async function loadDau() {
  clearTimeout(dauTimer);
  const q = new URLSearchParams(location.search);
  q.set('days', $('dau-days').value);
  try {
    const res = await fetch('/debug/dau?' + q, { cache: 'no-store' });
    if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
    dau = await res.json();
    $('dau-tz').textContent = `(${dau.tz})`;
    renderDauTable();
    drawDau();
  } catch (err) {
    $('dau-tz').textContent = `(error: ${err.message})`;
  }
  dauTimer = setTimeout(loadDau, 60_000);
}

function niceMax(v) {
  if (v <= 4) return 4;
  const mag = 10 ** Math.floor(Math.log10(v));
  return [1, 2, 2.5, 5, 10].map(m => m * mag).find(m => m >= v);
}

function dauGeometry(canvas) {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  const n = dau.days.length;
  const plotW = w - DAU_PAD.l - DAU_PAD.r, plotH = h - DAU_PAD.t - DAU_PAD.b;
  const yMax = niceMax(Math.max(...dau.days.flatMap(d => [d.dau, d.udau])));
  const x = (i) => DAU_PAD.l + (n === 1 ? plotW / 2 : i / (n - 1) * plotW);
  const y = (v) => DAU_PAD.t + plotH - v / yMax * plotH;
  return { w, h, n, plotW, plotH, yMax, x, y };
}

function drawDau() {
  if (!dau) return;
  const canvas = $('dau');
  const dpr = window.devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * dpr;
  canvas.height = canvas.clientHeight * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const g = dauGeometry(canvas);
  const muted = getComputedStyle(document.body).getPropertyValue('--muted');

  // y grid + labels
  ctx.font = '11px ui-monospace, Menlo, monospace';
  ctx.lineWidth = 1;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'right';
  for (let k = 0; k <= 4; k++) {
    const v = g.yMax * k / 4, yy = Math.round(g.y(v)) + 0.5;
    ctx.strokeStyle = '#1a2238';
    ctx.beginPath(); ctx.moveTo(DAU_PAD.l, yy); ctx.lineTo(g.w - DAU_PAD.r, yy); ctx.stroke();
    ctx.fillStyle = muted;
    ctx.fillText(Number.isInteger(v) ? v : v.toFixed(1), DAU_PAD.l - 6, yy);
  }
  // x labels (MM-DD), thinned to fit
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'center';
  const every = Math.max(1, Math.ceil(g.n / Math.max(1, Math.floor(g.plotW / 56))));
  for (let i = g.n - 1; i >= 0; i -= every) ctx.fillText(dau.days[i].day.slice(5), g.x(i), g.h - 6);

  // crosshair
  if (dauHover != null) {
    ctx.strokeStyle = '#3a4a70';
    const xx = Math.round(g.x(dauHover)) + 0.5;
    ctx.beginPath(); ctx.moveTo(xx, DAU_PAD.t); ctx.lineTo(xx, DAU_PAD.t + g.plotH); ctx.stroke();
  }

  // lines
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  for (const s of DAU_SERIES) {
    ctx.strokeStyle = s.color;
    ctx.beginPath();
    dau.days.forEach((d, i) => (i ? ctx.lineTo : ctx.moveTo).call(ctx, g.x(i), g.y(d[s.key])));
    ctx.stroke();
    // marker on today and the hovered day, ringed with the panel color
    for (const i of new Set([g.n - 1, dauHover].filter(i => i != null))) {
      ctx.fillStyle = s.color;
      ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--panel');
      ctx.beginPath(); ctx.arc(g.x(i), g.y(dau.days[i][s.key]), 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
  }
  const today = dau.days[g.n - 1];
  $('dau-today').textContent = `${today.dau} today`;
  $('udau-today').textContent = `${today.udau} today`;
}

function showDauTip(ev) {
  if (!dau) return;
  const canvas = $('dau');
  const g = dauGeometry(canvas);
  const px = ev.clientX - canvas.getBoundingClientRect().left;
  const i = g.n === 1 ? 0 : Math.round(clamp01((px - DAU_PAD.l) / g.plotW) * (g.n - 1));
  if (i !== dauHover) { dauHover = i; drawDau(); }
  const d = dau.days[i];
  const tip = $('dau-tip');
  tip.replaceChildren(
    el('div', { className: 'muted', textContent: d.day }),
    ...DAU_SERIES.map(s => el('div', {},
      el('span', { className: 'key', style: `--c:${s.color}` }),
      el('b', { textContent: d[s.key] }),
      el('span', { className: 'muted', textContent: s.label }))),
  );
  tip.hidden = false;
  const x = g.x(i);
  const left = x + 12 + tip.offsetWidth > g.w ? x - 12 - tip.offsetWidth : x + 12;
  tip.style.left = `${left}px`;
}

const clamp01 = (v) => Math.min(1, Math.max(0, v));

function renderDauTable() {
  $('dau-table').replaceChildren(table([
    { label: 'day', get: d => d.day },
    { label: 'DAU (joins)', get: d => d.dau, num: true },
    { label: 'uDAU (unique players)', get: d => d.udau, num: true },
  ], dau.days.slice().reverse()));
}

$('dau').addEventListener('pointermove', showDauTip);
$('dau').addEventListener('pointerleave', () => { dauHover = null; $('dau-tip').hidden = true; drawDau(); });
$('dau-days').addEventListener('change', loadDau);
window.addEventListener('resize', drawDau);
loadDau();

$('pause').addEventListener('click', () => {
  paused = !paused;
  $('pause').textContent = paused ? 'Resume' : 'Pause';
  if (paused) setStatus('paused', 'var(--warn)'); else poll();
});
$('interval').addEventListener('change', poll);
$('event-filter').addEventListener('change', () => prev && renderEvents(prev));
poll();
</script>
</body>
</html>
